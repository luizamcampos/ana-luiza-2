<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Ana Luiza Campos</title>

  <style>
    /* =========================================================
       RESET
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      background: #000;
      color: white;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
    }


    /* =========================================================
       FUNDO FIXO
    ========================================================= */

    .fixed-background {
      position: fixed;
      inset: 0;
      z-index: -10;

      background-image: url("fundo.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }


    /* =========================================================
       HOME
    ========================================================= */

    .home {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 100svh;
    }


    /* =========================================================
       MENU
    ========================================================= */

    .menu {
      position: absolute;
      top: 34px;
      left: 42px;

      display: flex;
      gap: 38px;

      z-index: 20;
    }

    .menu a {
      font-size: 13px;
      font-weight: 400;
      text-transform: lowercase;
      transition: opacity 0.25s ease;
    }

    .menu a:hover {
      opacity: 0.55;
    }


    /* =========================================================
       NOME CENTRAL
    ========================================================= */

    .intro {
      position: absolute;
      inset: 0;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
      pointer-events: none;

      padding: 30px;
    }

    .intro h1 {
      font-size: clamp(42px, 5.6vw, 88px);
      line-height: 0.95;
      font-weight: 400;

      letter-spacing: -0.055em;
      white-space: nowrap;
    }

    .intro p {
      margin-top: 18px;

      font-size: 11px;
      font-weight: 400;

      letter-spacing: 0.22em;
      text-transform: lowercase;
    }


    /* =========================================================
       ÁREA TRANSPARENTE / EXPERIÊNCIA
    ========================================================= */

    .experience {
      position: relative;

      min-height: 270px;
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    /*
      Essa camada cria a transparência contínua.
      Ela continua por trás de toda a área dos projetos.
    */

    .experience::before,
    .projects-section::before {
      content: "";
      position: absolute;
      inset: 0;

      background: rgba(235, 225, 205, 0.26);

      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);

      z-index: 0;
    }

    .experience-content {
      position: relative;
      z-index: 2;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }


    /* AZULEJO */

    .tile-symbol {
      width: 76px;
      height: auto;
      object-fit: contain;
    }


    /* EXPERIÊNCIA */

    .experience-title {
      margin-top: 18px;

      font-size: 14px;
      font-weight: 400;

      letter-spacing: 0.28em;
      text-transform: lowercase;
    }


    /* ARRASTE PARA BAIXO */

    .drag-down {
      position: absolute;

      left: 22px;
      bottom: 32px;

      z-index: 5;

      font-size: 10px;
      letter-spacing: 0.18em;

      text-transform: lowercase;

      transform: rotate(-90deg);
      transform-origin: left bottom;

      white-space: nowrap;

      opacity: 0.9;
    }


    /* =========================================================
       PROJETOS
    ========================================================= */

    .projects-section {
      position: relative;

      width: 100%;
      min-height: 100vh;

      padding:
        26px
        clamp(42px, 6vw, 100px)
        90px;

      overflow: hidden;
    }

    .projects-grid {
      position: relative;
      z-index: 2;

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      gap: 16px;
    }


    /* =========================================================
       CARD
    ========================================================= */

    .project {
      position: relative;

      width: 100%;
      aspect-ratio: 1.45 / 1;

      overflow: hidden;

      background: rgba(0, 0, 0, 0.15);

      cursor: pointer;

      opacity: 0;
      transform: translateY(45px);

      transition:
        opacity 0.8s ease,
        transform 0.8s ease;
    }

    .project.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .project img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      transition: transform 0.6s ease;
    }

    .project:hover img {
      transform: scale(1.025);
    }


    /* =========================================================
       OVERLAY DOS PROJETOS
    ========================================================= */

    .project-overlay {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: flex-start;
      justify-content: flex-start;

      padding: 18px;

      background: rgba(225, 214, 195, 0.25);

      -webkit-backdrop-filter: blur(13px);
      backdrop-filter: blur(13px);

      opacity: 0;

      transition: opacity 0.35s ease;
    }

    .project:hover .project-overlay {
      opacity: 1;
    }

    .project-name {
      color: white;

      font-size: 18px;
      font-weight: 400;

      letter-spacing: -0.02em;
    }


    /* =========================================================
       CONTATO
    ========================================================= */

    .contact {
      position: relative;

      min-height: 72vh;

      display: flex;
      flex-direction: column;
      justify-content: center;

      padding:
        90px
        clamp(42px, 8vw, 130px);

      overflow: hidden;
    }

    .contact::before {
      content: "";
      position: absolute;
      inset: 0;

      background: rgba(225, 214, 195, 0.25);

      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);

      z-index: 0;
    }

    .contact-inner {
      position: relative;
      z-index: 2;

      opacity: 0;
      transform: translateY(40px);

      transition:
        opacity 0.8s ease,
        transform 0.8s ease;
    }

    .contact-inner.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .contact h2 {
      font-size: clamp(32px, 4vw, 56px);

      font-weight: 400;
      letter-spacing: -0.05em;

      text-transform: lowercase;

      margin-bottom: 30px;
    }

    .contact-links {
      display: flex;
      flex-direction: column;

      gap: 12px;
    }

    .contact-link {
      width: fit-content;

      display: flex;
      align-items: center;

      gap: 12px;

      font-size: 15px;
      font-weight: 400;

      transition: opacity 0.25s ease;
    }

    .contact-link:hover {
      opacity: 0.55;
    }

    .contact-icon {
      width: 20px;
      height: 20px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contact-icon svg {
      width: 100%;
      height: 100%;

      fill: none;
      stroke: currentColor;

      stroke-width: 1.6;
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {

      /*
        No celular a home + experiência formam
        exatamente a primeira tela.

        Assim NÃO aparece nenhuma ponta dos projetos
        antes de começar o scroll.
      */

      .home {
        height: calc(100svh - 255px);
        min-height: calc(100svh - 255px);
      }


      /* FUNDO GIRADO 90° NO MOBILE */

      .fixed-background {
        inset: auto;

        top: 50%;
        left: 50%;

        width: 100vh;
        height: 100vw;

        transform: translate(-50%, -50%) rotate(90deg);

        background-size: cover;
        background-position: center;
      }


      /* MENU */

      .menu {
        top: 40px;
        left: 32px;

        gap: 36px;
      }

      .menu a {
        font-size: 14px;
      }


      /* NOME */

      .intro {
        padding: 0 22px;

        transform: translateY(15px);
      }

      .intro h1 {
        width: 100%;

        font-size: clamp(35px, 9.5vw, 52px);

        line-height: 1;

        letter-spacing: -0.055em;

        white-space: nowrap;

        text-align: center;
      }

      .intro p {
        margin-top: 18px;

        font-size: 10px;

        letter-spacing: 0.17em;

        text-align: center;
      }


      /* EXPERIÊNCIA */

      .experience {
        min-height: 255px;
        height: 255px;
      }

      .tile-symbol {
        width: 78px;
      }

      .experience-title {
        margin-top: 16px;

        font-size: 14px;

        letter-spacing: 0.25em;
      }

      .drag-down {
        left: 18px;
        bottom: 28px;

        font-size: 9px;
      }


      /* PROJETOS */

      .projects-section {
        min-height: 100vh;

        padding:
          24px
          22px
          70px;
      }

      .projects-grid {
        grid-template-columns: repeat(2, 1fr);

        gap: 10px;
      }

      .project {
        aspect-ratio: 0.95 / 1;
      }


      /*
        No celular não existe hover de verdade.
        O nome aparece discretamente sobre a foto.
      */

      .project-overlay {
        opacity: 1;

        align-items: flex-end;

        padding: 12px;

        background:
          linear-gradient(
            to top,
            rgba(0,0,0,0.45),
            rgba(0,0,0,0) 55%
          );

        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }

      .project-name {
        font-size: 13px;
      }


      /* CONTATO */

      .contact {
        min-height: 62vh;

        padding: 70px 32px;
      }

      .contact h2 {
        font-size: 30px;

        margin-bottom: 22px;
      }

      .contact-links {
        gap: 10px;
      }

      .contact-link {
        font-size: 14px;
      }

      .contact-icon {
        width: 18px;
        height: 18px;
      }
    }


    /* =========================================================
       MOBILE MUITO PEQUENO
    ========================================================= */

    @media (max-width: 390px) {

      .intro h1 {
        font-size: 8.7vw;
      }

      .intro p {
        font-size: 8.5px;
      }

      .projects-section {
        padding-left: 18px;
        padding-right: 18px;
      }
    }

  </style>
</head>

  <!-- =======================================================
       REVEAL NO SCROLL
  ======================================================== -->

  <script>

    const revealElements =
      document.querySelectorAll(".reveal");


    const revealObserver =
      new IntersectionObserver(

        (entries, observer) => {

          entries.forEach((entry) => {

            if (entry.isIntersecting) {

              entry.target.classList.add("visible");

              observer.unobserve(entry.target);

            }

          });

        },

        {
          threshold: 0.14
        }

      );


    revealElements.forEach((element) => {

      revealObserver.observe(element);

    });



    /* CONTATO */

    const contactElement =
      document.querySelector(".reveal-contact");


    const contactObserver =
      new IntersectionObserver(

        (entries) => {

          entries.forEach((entry) => {

            if (entry.isIntersecting) {

              entry.target.classList.add("visible");

            }

          });

        },

        {
          threshold: 0.18
        }

      );


    if (contactElement) {

      contactObserver.observe(contactElement);

    }

  </script>
